name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag on the current main commit (for example v0.2.1)
        required: true
        type: string
permissions:
  contents: read
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'abruption/rebut' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-policy.mjs identity
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack once and record the artifact
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact --json > release-artifact/pack.json
          node scripts/release-policy.mjs artifact
      - name: Smoke-test the exact publication artifact
        env:
          REBUT_SMOKE_ARTIFACT_DIR: release-artifact
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release-artifact/rebut-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.repository == 'abruption/rebut' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release-artifact
      - name: Check approved artifact and npm OIDC support
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node -e 'if(!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1); const [a,b,c]=process.argv[1].split(".").map(Number); if(a<11 || (a===11 && (b<5 || (b===5 && c<1)))) process.exit(1)' "$(npm --version)"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$SHA256" "release-artifact/rebut-mcp-$VERSION.tgz" | sha256sum --check --strict
      - name: Publish the approved tarball through OIDC
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const version = process.env.VERSION;
          const exists = await fetch(`https://registry.npmjs.org/rebut-mcp/${version}`, {signal: AbortSignal.timeout(15000)});
          assert.equal(exists.status, 404, 'Version exists or registry unavailable; do not publish');
          const response = await fetch('https://registry.npmjs.org/rebut-mcp/latest', {signal: AbortSignal.timeout(15000)});
          assert.equal(response.status, 200);
          const latest = (await response.json()).version;
          assert.match(latest, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          const a = version.split('.').map(BigInt), b = latest.split('.').map(BigInt);
          const index = a.findIndex((value, i) => value !== b[i]);
          assert(index >= 0 && a[index] > b[index], 'Version must still advance latest after approval');
          JS
          npm publish "./release-artifact/rebut-mcp-$VERSION.tgz" --access public --tag latest --provenance --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Verify the public registry artifact
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const {VERSION, SHA256} = process.env;
          for (let attempt = 0; attempt < 20; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/rebut-mcp/${VERSION}`, {signal: AbortSignal.timeout(15000)});
            if (response.status === 404) { await new Promise(resolve => setTimeout(resolve, 15000)); continue; }
            if (!response.ok) throw new Error(`Registry verification failed: ${response.status}`);
            const metadata = await response.json();
            if (!metadata.dist?.attestations) { await new Promise(resolve => setTimeout(resolve, 15000)); continue; }
            const url = new URL(metadata.dist.tarball);
            if (url.origin !== 'https://registry.npmjs.org') throw new Error('Unexpected tarball host');
            const tarball = await fetch(url, {signal: AbortSignal.timeout(30000)});
            if (!tarball.ok) throw new Error('Cannot download the published tarball');
            const sha = createHash('sha256').update(Buffer.from(await tarball.arrayBuffer())).digest('hex');
            if (sha !== SHA256) throw new Error('Published artifact hash mismatch');
            console.log(`Verified rebut-mcp@${VERSION} (${sha})`);
            process.exit(0);
          }
          throw new Error('Publication was accepted but registry visibility is pending; inspect the original run before any retry');
          JS
