name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:package
  windows-mcp:
    uses: ./.github/workflows/windows-poc.yml
  verify:
    name: verify
    needs: [matrix, windows-mcp]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the test matrix and Windows package probe to pass
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          WINDOWS_RESULT: ${{ needs.windows-mcp.result }}
        run: |
          printf 'Test matrix: %s\nWindows package probe: %s\n' "$MATRIX_RESULT" "$WINDOWS_RESULT"
          test "$MATRIX_RESULT" = success && test "$WINDOWS_RESULT" = success
