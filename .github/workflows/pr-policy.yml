name: PR policy

on:
  # Keep this metadata-only: use the trusted base revision, never PR code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-first:
    name: Issue-first PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require an issue created before the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          const repository = process.env.GITHUB_REPOSITORY;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          async function get(resource) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${resource}`, { headers });
            if (!response.ok) throw new Error('Unable to verify the pull request or linked issue.');
            return response.json();
          }
          try {
            const pr = await get(`pulls/${process.env.PR_NUMBER}`);
            const links = [...(pr.body ?? '').matchAll(/^(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([1-9][0-9]*)\s*$/gim)];
            if (!links.length) throw new Error('Add Closes #n on its own line; create the issue before the PR.');
            for (const number of new Set(links.map((match) => match[1]))) {
              const issue = await get(`issues/${number}`);
              const issueCreated = Date.parse(issue.created_at);
              const prCreated = Date.parse(pr.created_at);
              if (issue.pull_request || issue.state !== 'open' || !Number.isFinite(issueCreated)
                  || !Number.isFinite(prCreated) || issueCreated > prCreated) {
                throw new Error('Each linked issue must be an open issue created before this PR.');
              }
            }
            console.log('Issue-first PR policy passed.');
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          JS
